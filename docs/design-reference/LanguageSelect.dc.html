<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Language select</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F5D50}a:hover{color:#1F4238}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #F7F6F2; color: #1C1C1A; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 56px; position: relative">
  <div style="position: absolute; left: 40px; right: 40px; top: 32px; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="font-family: 'Source Serif 4', serif; font-style: italic; font-size: 20px; color: #2F5D50">AI</span>
      <span style="font-size: 13px; font-weight: 500; letter-spacing: 0.14em">WORKSHOP</span>
      <span style="width: 1px; height: 16px; background: #D6D3CA"></span>
      <span style="font-size: 13px; color: #6B6A65">Pre-session survey</span>
    </div>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #6B6A65">FALL 2026</span>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center">
    <h1 style="margin: 0; font-family: 'Source Serif 4', serif; font-weight: 400; font-size: 56px; line-height: 1.08; letter-spacing: -0.015em">Choose your language</h1>
    <p style="margin: 0; font-family: 'Noto Serif KR', serif; font-size: 24px; color: #6B6A65">언어를 선택해 주세요</p>
  </div>

  <div style="display: flex; gap: 24px">
    <button style="width: 300px; height: 196px; box-sizing: border-box; padding: 24px 28px; background: #FFFFFF; border: 1.5px solid #2F5D50; border-radius: 14px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; cursor: pointer; font-family: inherit; color: #1C1C1A; box-shadow: 0 14px 32px -22px rgba(47,93,80,0.55)">
      <div style="display: flex; justify-content: space-between; align-items: center; width: 100%">
        <span style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #2F5D50; color: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 13px">E</span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2F5D50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-family: 'Source Serif 4', serif; font-size: 38px; line-height: 1">English</span>
        <span style="font-size: 14px; color: #6B6A65">Continue in English</span>
      </div>
    </button>
    <button style="width: 300px; height: 196px; box-sizing: border-box; padding: 24px 28px; background: #FFFFFF; border: 1px solid #E3E1DA; border-radius: 14px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; cursor: pointer; font-family: inherit; color: #1C1C1A">
      <div style="display: flex; justify-content: space-between; align-items: center; width: 100%">
        <span style="width: 28px; height: 28px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 1px solid #D6D3CA; background: #FAFAF7; color: #6B6A65; font-family: 'IBM Plex Mono', monospace; font-size: 13px">K</span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B9B6AD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-family: 'Noto Serif KR', serif; font-size: 34px; line-height: 1.1">한국어</span>
        <span style="font-family: 'IBM Plex Sans KR', sans-serif; font-size: 14px; color: #6B6A65">한국어로 진행하기</span>
      </div>
    </button>
  </div>

  <p style="margin: 0; font-size: 14px; color: #6B6A65">You can switch anytime <span style="color: #B9B6AD; padding: 0 8px">·</span> <span style="font-family: 'IBM Plex Sans KR', sans-serif">언제든 바꿀 수 있어요</span></p>

  <div style="position: absolute; left: 40px; right: 40px; bottom: 32px; display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6B6A65; letter-spacing: 0.06em">
    <span>≈ 9 MIN · 7 SECTIONS · 24 QUESTIONS</span>
    <span>PRESS E OR K</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
