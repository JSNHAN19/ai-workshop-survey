<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모바일 — 배우고 싶은 것</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F5D50}a:hover{color:#1F4238}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F6F2; color: #1C1C1A; font-family: 'IBM Plex Sans KR', sans-serif; word-break: keep-all; display: flex; flex-direction: column; overflow: hidden">
  <header style="height: 52px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E3E1DA; position: relative">
    <span style="font-family: 'Noto Serif KR', serif; font-size: 18px; color: #2F5D50">AI</span>
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #6B6A65">04 / 07</span>
      <div style="display: flex; padding: 2px; border: 1px solid #E3E1DA; border-radius: 999px; background: #FFFFFF">
        <button aria-pressed="false" style="height: 30px; min-width: 40px; padding: 0 10px; border: none; border-radius: 999px; background: transparent; color: #6B6A65; font-family: 'IBM Plex Mono', monospace; font-size: 12px">EN</button>
        <button aria-pressed="true" style="height: 30px; min-width: 40px; padding: 0 10px; border: none; border-radius: 999px; background: #1C1C1A; color: #FFFFFF; font-family: 'IBM Plex Sans KR', sans-serif; font-size: 13px; font-weight: 600">한</button>
      </div>
    </div>
    <div style="position: absolute; left: 0; bottom: -1px; height: 2px; width: 50%; background: #2F5D50"></div>
  </header>

  <main style="flex-grow: 1; box-sizing: border-box; padding: 28px 20px 24px; display: flex; flex-direction: column; gap: 22px; overflow: hidden">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.04em; color: #2F5D50; border-top: 1px solid #1C1C1A; padding-top: 14px">Q · 12 <span style="font-family: 'IBM Plex Sans KR', sans-serif; color: #6B6A65">— 배우고 만들어보고 싶은 것</span></span>
    <h1 style="margin: 0; font-family: 'Noto Serif KR', serif; font-weight: 500; font-size: 24px; line-height: 1.4; letter-spacing: -0.01em">어떤 것을 배워보고 싶으신가요?</h1>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #E3E1DA; padding-bottom: 8px">
          <span style="font-size: 14px; font-weight: 600; color: #3D3C38">{{g.title}}</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6B6A65">{{g.count}}</span>
        </div>
        <sc-for list="{{g.items}}" as="it" hint-placeholder-count="4">
          <sc-if value="{{it.on}}" hint-placeholder-val="{{false}}">
            <button role="checkbox" aria-checked="true" onClick="{{it.toggle}}" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; box-sizing: border-box; padding: 12px 16px; background: #E6EEEA; border: 1.5px solid #2F5D50; border-radius: 10px; font-family: inherit; font-size: 16px; line-height: 1.45; color: #1C1C1A; text-align: left">
              <span style="flex-grow: 1">{{it.label}}</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F5D50" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            </button>
          </sc-if>
          <sc-if value="{{it.off}}" hint-placeholder-val="{{true}}">
            <button role="checkbox" aria-checked="false" onClick="{{it.toggle}}" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; box-sizing: border-box; padding: 12px 16px; background: #FFFFFF; border: 1px solid #E3E1DA; border-radius: 10px; font-family: inherit; font-size: 16px; line-height: 1.45; color: #1C1C1A; text-align: left">
              <span style="flex-grow: 1">{{it.label}}</span>
            </button>
          </sc-if>
        </sc-for>
      </section>
    </sc-for>
  </main>

  <footer style="flex-shrink: 0; box-sizing: border-box; padding: 12px 20px 34px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #E3E1DA; background: #F7F6F2">
    <button aria-label="이전" style="width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 1px solid #E3E1DA; border-radius: 10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1C1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </button>
    <button style="flex-grow: 1; height: 48px; background: #2F5D50; color: #FFFFFF; border: none; border-radius: 10px; font-family: inherit; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 10px">확인 <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; opacity: 0.8">· {{count}}개 선택</span></button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = (this.state && this.state.sel) || ["prompting", "reading_assistant", "website"];
    const data = [
      { title: "AI 더 잘 쓰기", items: [
        ["prompting", "AI에게 더 잘 질문하는 법 (프롬프트 작성)"],
        ["reading_assistant", "AI로 PDF·논문 읽고 분석하기"],
        ["custom_assistant", "특정 업무 전용 AI 조수 만들기"],
        ["fact_check", "AI 결과물의 정확성 검증하기"]
      ]},
      { title: "AI로 직접 만들기", items: [
        ["website", "웹사이트 만들기 (개인·연구실·강의 페이지)"],
        ["personal_tool", "나만의 관리 도구 만들기 (일정, 논문 목록, 학생 관리)"],
        ["survey_tool", "이런 설문지나 신청 폼 만들기"],
        ["interactive_materials", "인터랙티브 수업 자료 만들기 (퀴즈, 게임)"],
        ["dashboard", "데이터를 차트·대시보드로 시각화하기"],
        ["automation", "반복 업무 자동화하기 (이메일 분류, 파일 정리)"]
      ]}
    ];
    const toggle = (id) => {
      const cur = sel.slice();
      const i = cur.indexOf(id);
      if (i >= 0) cur.splice(i, 1); else cur.push(id);
      this.setState({ sel: cur });
    };
    const groups = data.map((g) => ({
      title: g.title,
      count: String(g.items.length).padStart(2, "0"),
      items: g.items.map((it) => {
        const on = sel.indexOf(it[0]) >= 0;
        return { label: it[1], on: on, off: !on, toggle: () => toggle(it[0]) };
      })
    }));
    return { groups: groups, count: sel.length };
  }
}
</script>
</body>
</html>
