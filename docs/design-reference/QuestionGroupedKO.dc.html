<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>배우고 싶은 것</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F5D50}a:hover{color:#1F4238}
</style>
</helmet>
<div style="width: 1280px; height: 960px; box-sizing: border-box; background: #F7F6F2; color: #1C1C1A; font-family: 'IBM Plex Sans KR', sans-serif; word-break: keep-all; display: flex; flex-direction: column">
  <header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E3E1DA; position: relative">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="font-family: 'Noto Serif KR', serif; font-size: 18px; color: #2F5D50">AI</span>
      <span style="font-size: 14px; font-weight: 500; letter-spacing: 0.04em">워크숍</span>
      <span style="width: 1px; height: 16px; background: #D6D3CA"></span>
      <span style="font-size: 13px; color: #6B6A65">사전 설문</span>
    </div>
    <div style="display: flex; align-items: center; gap: 24px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; color: #6B6A65">섹션 04 / 07</span>
      <div style="display: flex; padding: 3px; border: 1px solid #E3E1DA; border-radius: 999px; background: #FFFFFF">
        <button aria-pressed="false" style="height: 32px; min-width: 44px; padding: 0 12px; border: none; border-radius: 999px; background: transparent; color: #6B6A65; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; cursor: pointer">EN</button>
        <button aria-pressed="true" style="height: 32px; min-width: 44px; padding: 0 12px; border: none; border-radius: 999px; background: #1C1C1A; color: #FFFFFF; font-family: 'IBM Plex Sans KR', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">한</button>
      </div>
    </div>
    <div style="position: absolute; left: 0; bottom: -1px; height: 2px; width: 50%; background: #2F5D50"></div>
  </header>

  <main style="flex-grow: 1; display: flex; justify-content: center; padding: 48px 40px 0">
    <div style="width: 1040px; display: grid; grid-template-columns: 160px minmax(0, 1fr); column-gap: 48px; border-top: 1px solid #1C1C1A; padding-top: 24px; align-self: flex-start">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; color: #2F5D50">Q · 12</span>
        <span style="font-size: 13px; line-height: 1.5; color: #6B6A65">배우고 만들어보고<br>싶은 것</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 24px">
        <h1 style="margin: 0; font-family: 'Noto Serif KR', serif; font-weight: 500; font-size: 32px; line-height: 1.35; letter-spacing: -0.01em">어떤 것을 배워보고 싶으신가요?</h1>

        <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
          <section style="display: flex; flex-direction: column; gap: 10px">
            <div style="display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #E3E1DA; padding-bottom: 8px">
              <span style="font-size: 14px; font-weight: 600; color: #3D3C38">{{g.title}}</span>
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6B6A65">{{g.count}}</span>
            </div>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
              <sc-for list="{{g.items}}" as="it" hint-placeholder-count="4">
                <sc-if value="{{it.on}}" hint-placeholder-val="{{false}}">
                  <button role="checkbox" aria-checked="true" onClick="{{it.toggle}}" style="display: flex; align-items: center; gap: 14px; min-height: 52px; box-sizing: border-box; padding: 12px 16px; background: #E6EEEA; border: 1.5px solid #2F5D50; border-radius: 10px; font-family: inherit; font-size: 16px; line-height: 1.4; color: #1C1C1A; text-align: left; cursor: pointer">
                    <span style="width: 24px; height: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #2F5D50; color: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 12px">{{it.key}}</span>
                    <span style="flex-grow: 1">{{it.label}}</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F5D50" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
                  </button>
                </sc-if>
                <sc-if value="{{it.off}}" hint-placeholder-val="{{true}}">
                  <button role="checkbox" aria-checked="false" onClick="{{it.toggle}}" style="display: flex; align-items: center; gap: 14px; min-height: 52px; box-sizing: border-box; padding: 12px 16px; background: #FFFFFF; border: 1px solid #E3E1DA; border-radius: 10px; font-family: inherit; font-size: 16px; line-height: 1.4; color: #1C1C1A; text-align: left; cursor: pointer">
                    <span style="width: 24px; height: 24px; box-sizing: border-box; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 1px solid #D6D3CA; background: #FAFAF7; color: #6B6A65; font-family: 'IBM Plex Mono', monospace; font-size: 12px">{{it.key}}</span>
                    <span style="flex-grow: 1">{{it.label}}</span>
                  </button>
                </sc-if>
              </sc-for>
            </div>
          </section>
        </sc-for>

        <div style="display: flex; align-items: center; gap: 20px; padding-top: 4px">
          <button style="height: 48px; padding: 0 24px; background: #2F5D50; color: #FFFFFF; border: none; border-radius: 8px; font-family: inherit; font-size: 16px; font-weight: 500; display: inline-flex; align-items: center; gap: 10px; cursor: pointer">확인
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          </button>
          <span style="font-size: 14px; color: #6B6A65"><span style="font-family: 'IBM Plex Mono', monospace; border: 1px solid #D6D3CA; border-radius: 4px; padding: 2px 6px; background: #FFFFFF">Enter ↵</span> 누르기</span>
          <span style="margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #2F5D50">{{count}}개 선택됨</span>
        </div>
      </div>
    </div>
  </main>

  <footer style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #E3E1DA">
    <button style="height: 44px; padding: 0; background: none; border: none; font-family: inherit; font-size: 15px; color: #6B6A65; cursor: pointer">← 이전</button>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.02em; color: #6B6A65">A–L 선택 · Enter 계속 · Esc 이전</span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; color: #1C1C1A">12 <span style="color: #8A877F">/ 24</span></span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = (this.state && this.state.sel) || ["prompting", "reading_assistant", "website", "personal_tool", "interactive_materials"];
    const data = [
      { title: "AI 더 잘 쓰기", items: [
        ["prompting", "AI에게 더 잘 질문하는 법 (프롬프트 작성)"],
        ["reading_assistant", "AI로 PDF·논문 읽고 분석하기"],
        ["custom_assistant", "특정 업무 전용 AI 조수 만들기"],
        ["fact_check", "AI 결과물의 정확성 검증하기"]
      ]},
      { title: "AI로 직접 만들기", items: [
        ["website", "웹사이트 만들기 (개인·연구실·강의 페이지)"],
        ["personal_tool", "나만의 관리 도구 만들기 (일정, 논문 목록, 학생 관리)"],
        ["survey_tool", "이런 설문지나 신청 폼 만들기"],
        ["interactive_materials", "인터랙티브 수업 자료 만들기 (퀴즈, 게임)"],
        ["dashboard", "데이터를 차트·대시보드로 시각화하기"],
        ["automation", "반복 업무 자동화하기 (이메일 분류, 파일 정리)"]
      ]},
      { title: "콘텐츠 제작", items: [
        ["visuals", "슬라이드·인포그래픽·이미지 만들기"],
        ["video_audio", "짧은 영상·오디오 만들기 (강의 요약 등)"]
      ]}
    ];
    const keys = "ABCDEFGHIJKL";
    let k = 0;
    const toggle = (id) => {
      const cur = sel.slice();
      const i = cur.indexOf(id);
      if (i >= 0) cur.splice(i, 1); else cur.push(id);
      this.setState({ sel: cur });
    };
    const groups = data.map((g) => {
      const items = g.items.map((it) => {
        const on = sel.indexOf(it[0]) >= 0;
        const out = { key: keys[k], label: it[1], on: on, off: !on, toggle: () => toggle(it[0]) };
        k += 1;
        return out;
      });
      return { title: g.title, count: String(g.items.length).padStart(2, "0"), items: items };
    });
    return { groups: groups, count: sel.length };
  }
}
</script>
</body>
</html>
