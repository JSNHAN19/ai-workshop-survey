<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How often do you use AI</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans+KR:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F5D50}a:hover{color:#1F4238}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #F7F6F2; color: #1C1C1A; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column">
  <header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E3E1DA; position: relative">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="font-family: 'Source Serif 4', serif; font-style: italic; font-size: 20px; color: #2F5D50">AI</span>
      <span style="font-size: 13px; font-weight: 500; letter-spacing: 0.14em">WORKSHOP</span>
      <span style="width: 1px; height: 16px; background: #D6D3CA"></span>
      <span style="font-size: 13px; color: #6B6A65">Pre-session survey</span>
    </div>
    <div style="display: flex; align-items: center; gap: 24px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #6B6A65">SECTION 02 / 07</span>
      <div style="display: flex; padding: 3px; border: 1px solid #E3E1DA; border-radius: 999px; background: #FFFFFF">
        <button aria-pressed="true" style="height: 32px; min-width: 44px; padding: 0 12px; border: none; border-radius: 999px; background: #1C1C1A; color: #FFFFFF; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer">EN</button>
        <button aria-pressed="false" style="height: 32px; min-width: 44px; padding: 0 12px; border: none; border-radius: 999px; background: transparent; color: #6B6A65; font-family: 'IBM Plex Sans KR', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer">한</button>
      </div>
    </div>
    <div style="position: absolute; left: 0; bottom: -1px; height: 2px; width: 17%; background: #2F5D50"></div>
  </header>

  <main style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 0 40px">
    <div style="width: 880px; display: grid; grid-template-columns: 160px minmax(0, 1fr); column-gap: 48px; border-top: 1px solid #1C1C1A; padding-top: 24px">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; color: #2F5D50">Q · 04</span>
        <span style="font-size: 13px; line-height: 1.45; color: #6B6A65">Your experience<br>with AI</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 28px">
        <h1 style="margin: 0; font-family: 'Source Serif 4', serif; font-weight: 500; font-size: 34px; line-height: 1.22; letter-spacing: -0.01em">How often do you currently use AI tools like ChatGPT?</h1>
        <div style="display: flex; flex-direction: column; gap: 10px" role="radiogroup" aria-label="How often do you use AI tools">
          <sc-for list="{{options}}" as="opt" hint-placeholder-count="5">
            <sc-if value="{{opt.on}}" hint-placeholder-val="{{false}}">
              <button role="radio" aria-checked="true" onClick="{{opt.pick}}" style="display: flex; align-items: center; gap: 16px; width: 100%; min-height: 56px; box-sizing: border-box; padding: 14px 20px; background: #E6EEEA; border: 1.5px solid #2F5D50; border-radius: 10px; font-family: inherit; font-size: 18px; color: #1C1C1A; text-align: left; cursor: pointer">
                <span style="width: 26px; height: 26px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #2F5D50; color: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 12px">{{opt.key}}</span>
                <span style="flex-grow: 1">{{opt.label}}</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2F5D50" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
              </button>
            </sc-if>
            <sc-if value="{{opt.off}}" hint-placeholder-val="{{true}}">
              <button role="radio" aria-checked="false" onClick="{{opt.pick}}" style="display: flex; align-items: center; gap: 16px; width: 100%; min-height: 56px; box-sizing: border-box; padding: 14px 20px; background: #FFFFFF; border: 1px solid #E3E1DA; border-radius: 10px; font-family: inherit; font-size: 18px; color: #1C1C1A; text-align: left; cursor: pointer">
                <span style="width: 26px; height: 26px; box-sizing: border-box; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 1px solid #D6D3CA; background: #FAFAF7; color: #6B6A65; font-family: 'IBM Plex Mono', monospace; font-size: 12px">{{opt.key}}</span>
                <span style="flex-grow: 1">{{opt.label}}</span>
              </button>
            </sc-if>
          </sc-for>
        </div>
      </div>
    </div>
  </main>

  <footer style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #E3E1DA">
    <button style="height: 44px; padding: 0; background: none; border: none; font-family: inherit; font-size: 15px; color: #6B6A65; cursor: pointer">← Back</button>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.04em; color: #6B6A65">A–E select · Esc back</span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; color: #1C1C1A">04 <span style="color: #8A877F">/ 24</span></span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const picked = (this.state && this.state.picked) || "monthly";
    const list = [
      ["never", "I've never used one"],
      ["tried", "I've tried it once or twice"],
      ["monthly", "Occasionally — a few times a month"],
      ["weekly", "Regularly — every week"],
      ["daily", "Almost every day"]
    ];
    const keys = "ABCDE";
    return {
      options: list.map((o, i) => ({
        key: keys[i],
        label: o[1],
        on: picked === o[0],
        off: picked !== o[0],
        pick: () => this.setState({ picked: o[0] })
      }))
    };
  }
}
</script>
</body>
</html>
