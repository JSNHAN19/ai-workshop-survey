<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Section intro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,400&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans+KR:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F5D50}a:hover{color:#1F4238}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #F7F6F2; color: #1C1C1A; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column">
  <header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E3E1DA; position: relative">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="font-family: 'Source Serif 4', serif; font-style: italic; font-size: 20px; color: #2F5D50">AI</span>
      <span style="font-size: 13px; font-weight: 500; letter-spacing: 0.14em">WORKSHOP</span>
      <span style="width: 1px; height: 16px; background: #D6D3CA"></span>
      <span style="font-size: 13px; color: #6B6A65">Pre-session survey</span>
    </div>
    <div style="display: flex; align-items: center; gap: 24px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #6B6A65">SECTION 02 / 07</span>
      <div style="display: flex; padding: 3px; border: 1px solid #E3E1DA; border-radius: 999px; background: #FFFFFF">
        <button aria-pressed="true" style="height: 32px; min-width: 44px; padding: 0 12px; border: none; border-radius: 999px; background: #1C1C1A; color: #FFFFFF; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer">EN</button>
        <button aria-pressed="false" style="height: 32px; min-width: 44px; padding: 0 12px; border: none; border-radius: 999px; background: transparent; color: #6B6A65; font-family: 'IBM Plex Sans KR', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer">한</button>
      </div>
    </div>
    <div style="position: absolute; left: 0; bottom: -1px; height: 2px; width: 13%; background: #2F5D50"></div>
  </header>

  <main style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 0 120px">
    <div style="display: flex; align-items: stretch; gap: 64px">
      <span style="font-family: 'Source Serif 4', serif; font-weight: 300; font-size: 240px; line-height: 0.8; color: #2F5D50; letter-spacing: -0.04em">02</span>
      <div style="width: 1px; background: #1C1C1A"></div>
      <div style="display: flex; flex-direction: column; justify-content: center; gap: 22px; width: 560px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.16em; color: #6B6A65">6 QUESTIONS · ABOUT 2 MINUTES</span>
        <h1 style="margin: 0; font-family: 'Source Serif 4', serif; font-weight: 400; font-size: 54px; line-height: 1.08; letter-spacing: -0.015em">Your experience with AI</h1>
        <div style="display: flex; align-items: center; gap: 20px; padding-top: 10px">
          <button style="height: 52px; padding: 0 26px; background: #2F5D50; color: #FFFFFF; border: none; border-radius: 8px; font-family: inherit; font-size: 17px; font-weight: 500; display: inline-flex; align-items: center; gap: 12px; cursor: pointer">Continue
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
          <span style="font-size: 14px; color: #6B6A65">press <span style="font-family: 'IBM Plex Mono', monospace; border: 1px solid #D6D3CA; border-radius: 4px; padding: 2px 6px; background: #FFFFFF">Enter ↵</span></span>
        </div>
      </div>
    </div>
  </main>

  <footer style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #E3E1DA">
    <button style="height: 44px; padding: 0; background: none; border: none; font-family: inherit; font-size: 15px; color: #6B6A65; cursor: pointer">← Back</button>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; color: #6B6A65">01 About you <span style="color: #2F5D50">— 02 Experience —</span> 03 Where AI helps</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
